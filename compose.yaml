services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cloudvault
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cloudvault]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      DB_HOST: database
      DB_NAME: cloudvault
      DB_USER: cloudvault
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: http://localhost:3000
      AI_ENGINE: local
      STORAGE_MODE: local
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
volumes:
  database:
  uploads:
